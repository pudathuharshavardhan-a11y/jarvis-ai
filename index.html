
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050b18;
  color: #e8f7ff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 22px;
  color: #42d9ff;
  letter-spacing: 4px;
  font-size: 24px;
}

.status {
  color: #65eaff;
  font-size: 13px;
  text-align: center;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 15px;
}

.circle {
  width: 140px;
  height: 140px;
  border: 3px solid #19caff;
  border-radius: 50%;
  margin: 25px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  box-shadow: 0 0 30px #008cff;
}

.chat {
  background: #0b1729;
  border: 1px solid #164e70;
  border-radius: 15px;
  padding: 15px;
  height: 380px;
  overflow-y: auto;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.user {
  background: #123e61;
  text-align: right;
}

.bot {
  background: #142538;
  text-align: left;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #168cba;
  background: #101e32;
  color: white;
  font-size: 15px;
}

button {
  padding: 12px 15px;
  background: #087cae;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #05a9e9;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.options {
  text-align: center;
  margin-top: 15px;
}

footer {
  text-align: center;
  padding: 20px;
  color: #6a91a9;
  font-size: 12px;
}

@media(max-width: 500px) {
  .controls {
    flex-wrap: wrap;
  }

  .controls input {
    flex-basis: 100%;
  }
}
</style>
</head>

<body>

<header>J.A.R.V.I.S AI</header>

<div class="status" id="status">
● CONNECTING TO AI SYSTEM
</div>

<div class="container">

<div class="circle">J</div>

<div class="chat" id="chat">
  <div class="message bot">
    Hello! I am JARVIS, your personal AI assistant.
    How can I help you today?
  </div>
</div>

<div class="controls">
  <input
    id="message"
    type="text"
    placeholder="Ask JARVIS anything..."
    autocomplete="off"
  >

  <button id="send" onclick="sendMessage()">SEND</button>
  <button onclick="startVoice()">🎤</button>
</div>

<div class="options">
  <button onclick="toggleVoice()" id="voiceButton">
    🔊 Voice: ON
  </button>

  <button onclick="clearChat()">
    Clear Chat
  </button>
</div>

</div>

<footer>
  JARVIS AI SYSTEM | POWERED BY GEMINI AI
</footer>

<script>

// YOUR CLOUDFLARE WORKER
const API_URL =
"https://sweet-sky-c168.pudathuharshavardhan.workers.dev";

let voiceEnabled = true;
let busy = false;

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

// Check backend
async function checkConnection() {
  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error("Connection failed");

    const data = await response.json();

    if (data.status === "online") {
      statusText.textContent = "● JARVIS AI ONLINE";
    } else {
      throw new Error("Unexpected response");
    }

  } catch (error) {
    statusText.textContent = "● CONNECTION ERROR";
  }
}

checkConnection();

// Add chat message
function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// Send message to Gemini
async function sendMessage() {

  const message = input.value.trim();

  if (!message || busy) return;

  addMessage(message, "user");

  input.value = "";
  busy = true;
  sendButton.disabled = true;
  statusText.textContent = "● JARVIS IS THINKING...";

  const loading = document.createElement("div");
  loading.className = "message bot";
  loading.textContent = "JARVIS is processing...";
  chat.appendChild(loading);

  try {

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed");
    }

    if (!data.reply) {
      throw new Error("No reply received");
    }

    loading.textContent = data.reply;

    if (voiceEnabled) {
      speak(data.reply);
    }

    statusText.textContent = "● JARVIS AI ONLINE";

  } catch (error) {

    loading.textContent =
      "Sorry! " + error.message;

    statusText.textContent = "● ERROR";

  } finally {

    busy = false;
    sendButton.disabled = false;
    input.focus();

  }
}

// Enter to send
input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});

// AI voice response
function speak(text) {

  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speech.rate = 1;
  speech.pitch = 1;

  speechSynthesis.speak(speech);
}

// Voice input
function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.interimResults = false;

  recognition.onstart = function() {
    statusText.textContent = "● LISTENING...";
  };

  recognition.onresult = function(event) {
    input.value =
      event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = function() {
    statusText.textContent = "● VOICE ERROR";
  };

  recognition.onend = function() {
    if (!busy) {
      statusText.textContent = "● JARVIS AI ONLINE";
    }
  };

  recognition.start();
}

// Enable / disable voice
function toggleVoice() {

  voiceEnabled = !voiceEnabled;

  document.getElementById("voiceButton").textContent =
    voiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";

  if (!voiceEnabled && "speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}

// Clear chat
function clearChat() {

  chat.innerHTML = "";

  addMessage(
    "Hello! I am JARVIS. How can I help you?",
    "bot"
  );

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}

</script>

</body>
</html>
